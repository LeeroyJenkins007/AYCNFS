[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "astro_tools"
version = "0.1.0"
description = "Astrodynamics and mission planning tools"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]